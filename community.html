<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팔이피플 — 커뮤니티</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --navy: #1B2A4A; --navy-light: #2A3F6A; --navy-dark: #111D35;
  --orange: #FF6B35; --orange-hover: #E85A28; --orange-light: #FFF0E9;
  --white: #FFFFFF;
  --gray-50: #F8F9FB; --gray-100: #F1F3F7; --gray-200: #E2E6EE;
  --gray-300: #C8CFDB; --gray-400: #9BA3B5; --gray-500: #6B7280;
  --gray-600: #4B5563; --gray-700: #374151;
  --green: #10B981; --green-light: #ECFDF5;
  --red: #EF4444; --red-light: #FEF2F2;
  --blue: #3B82F6; --blue-light: #EFF6FF;
  --gold: #F59E0B;
  --shadow-sm: 0 1px 3px rgba(27,42,74,0.06);
  --shadow-md: 0 4px 16px rgba(27,42,74,0.08);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
  background: var(--gray-50); color: var(--gray-700);
  line-height: 1.6; -webkit-font-smoothing: antialiased;
}

/* NAV */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(255,255,255,0.92); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--gray-200);
}
.nav-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 64px;
}
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 20px; color: var(--navy);
  text-decoration: none; letter-spacing: -0.5px;
}
.nav-logo .logo-icon {
  width: 36px; height: 36px; background: var(--orange);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  color: white; font-size: 15px; font-weight: 900; letter-spacing: -1px;
}
.nav-links { display: flex; gap: 8px; align-items: center; }
.nav-links a {
  text-decoration: none; color: var(--gray-600);
  font-size: 14px; font-weight: 600; padding: 8px 14px;
  border-radius: var(--radius-sm); transition: all 0.2s;
}
.nav-links a:hover { color: var(--navy); background: var(--gray-100); }
.nav-links a.active { color: var(--orange); background: var(--orange-light); }
.nav-profile {
  position: relative; display: none; align-items: center; gap: 8px;
  cursor: pointer; padding: 4px 10px 4px 4px; border-radius: 20px;
  border: 1.5px solid var(--gray-200); background: white; transition: all 0.2s;
}
.nav-profile:hover { border-color: var(--orange); background: var(--orange-light); }
.nav-profile.show { display: flex; }
.nav-profile-img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
.nav-profile-name { font-size: 13px; font-weight: 700; color: var(--navy); max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-profile-dropdown {
  display: none; position: absolute; top: calc(100% + 8px); right: 0;
  background: white; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.12);
  border: 1px solid var(--gray-200); min-width: 220px; overflow: hidden; z-index: 1001;
}
.nav-profile-dropdown.open { display: block; }
.nav-profile-dropdown-header {
  padding: 16px; border-bottom: 1px solid var(--gray-100);
  display: flex; align-items: center; gap: 12px;
}
.nav-profile-dropdown-header img { width: 40px; height: 40px; border-radius: 50%; }
.nav-profile-dropdown-info { display: flex; flex-direction: column; }
.nav-profile-dropdown-name { font-size: 14px; font-weight: 700; color: var(--navy); }
.nav-profile-dropdown-email { font-size: 12px; color: var(--gray-400); }
.nav-profile-dropdown a, .nav-profile-dropdown button {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 16px;
  font-size: 14px; font-weight: 600; color: var(--gray-600); background: none;
  border: none; text-decoration: none; cursor: pointer; font-family: inherit; transition: background 0.2s;
}
.nav-profile-dropdown a:hover, .nav-profile-dropdown button:hover { background: var(--gray-50); color: var(--navy); }
.nav-profile-dropdown .dropdown-icon { font-size: 16px; width: 20px; text-align: center; }
.nav-profile-dropdown .logout-btn { color: #EF4444; border-top: 1px solid var(--gray-100); }
.nav-profile-dropdown .logout-btn:hover { background: #FEF2F2; }
.mypage-overlay {
  display: none; position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,0.5); justify-content: center; align-items: flex-start;
  padding-top: 80px;
}
.mypage-overlay.open { display: flex; }
.mypage-modal {
  background: white; border-radius: 16px; width: 100%; max-width: 600px;
  max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}
.mypage-header {
  padding: 24px; border-bottom: 1px solid var(--gray-100);
  display: flex; align-items: center; justify-content: space-between;
}
.mypage-header h2 { font-size: 18px; font-weight: 800; color: var(--navy); }
.mypage-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--gray-400); }
.mypage-user {
  display: flex; align-items: center; gap: 16px; padding: 24px;
  background: var(--gray-50); border-bottom: 1px solid var(--gray-100);
}
.mypage-user img { width: 56px; height: 56px; border-radius: 50%; }
.mypage-user-name { font-size: 18px; font-weight: 800; color: var(--navy); }
.mypage-user-email { font-size: 13px; color: var(--gray-400); margin-top: 2px; }
.mypage-section { padding: 20px 24px; }
.mypage-section-title { font-size: 15px; font-weight: 800; color: var(--navy); margin-bottom: 12px; }
.mypage-review-item {
  padding: 14px; margin-bottom: 10px; border-radius: 10px;
  border: 1px solid var(--gray-200); background: white;
}
.mypage-review-meta { font-size: 12px; color: var(--gray-400); margin-bottom: 6px; }
.mypage-review-text { font-size: 14px; color: var(--gray-600); line-height: 1.5; }
.mypage-empty { text-align: center; padding: 40px 20px; color: var(--gray-400); font-size: 14px; }
.mypage-nickname-tag { display: inline-block; background: var(--orange-light); color: var(--orange); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-left: 8px; }
@media (max-width: 768px) {
  .nav-profile-name { display: none; }
  .mypage-modal { margin: 16px; max-height: 85vh; }
  .mypage-overlay { padding-top: 20px; align-items: center; }
}

/* CONTAINER */
.container {
  max-width: 800px; margin: 0 auto; padding: 88px 24px 60px;
}

/* PAGE HEADER */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px;
}
.page-title {
  font-size: 26px; font-weight: 900; color: var(--navy);
  letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px;
}
.page-title .icon { font-size: 24px; }
.btn-write {
  padding: 10px 20px; background: var(--orange); color: white;
  border: none; border-radius: var(--radius-sm); font-size: 14px;
  font-weight: 700; font-family: inherit; cursor: pointer;
  transition: all 0.2s; text-decoration: none;
}
.btn-write:hover { background: var(--orange-hover); transform: translateY(-1px); }

/* CATEGORY TABS */
.category-tabs {
  display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap;
}
.cat-tab {
  padding: 7px 16px; border-radius: 100px; font-size: 13px; font-weight: 700;
  border: 1.5px solid var(--gray-200); background: white; color: var(--gray-500);
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.cat-tab.active { background: var(--navy); color: white; border-color: var(--navy); }
.cat-tab:hover:not(.active) { border-color: var(--gray-300); color: var(--navy); }

/* POST LIST */
.post-list { display: flex; flex-direction: column; gap: 1px; }
.post-item {
  background: white; padding: 18px 20px;
  border: 1px solid var(--gray-200); border-radius: var(--radius-md);
  cursor: pointer; transition: all 0.2s; margin-bottom: 8px;
}
.post-item:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.post-top {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
}
.post-category-badge {
  padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
  background: var(--blue-light); color: var(--blue);
}
.post-category-badge.free { background: var(--green-light); color: var(--green); }
.post-category-badge.review { background: var(--orange-light); color: var(--orange); }
.post-category-badge.tip { background: #F3E8FF; color: #7C3AED; }
.post-category-badge.question { background: var(--gold); color: white; }
.post-hot {
  padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800;
  background: var(--red); color: white;
}
.post-title {
  font-size: 16px; font-weight: 700; color: var(--navy);
  margin-bottom: 6px; line-height: 1.4;
}
.post-preview {
  font-size: 13px; color: var(--gray-500); line-height: 1.5;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  max-width: 100%;
}
.post-bottom {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 10px; font-size: 12px; color: var(--gray-400);
}
.post-author { font-weight: 600; color: var(--gray-500); }
.post-stats { display: flex; gap: 12px; }
.post-stat { display: flex; align-items: center; gap: 3px; }

/* POST DETAIL MODAL */
.detail-overlay {
  display: none; position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
  padding: 24px; overflow-y: auto;
}
.detail-overlay.open { display: flex; justify-content: center; align-items: flex-start; }
.detail-modal {
  background: white; border-radius: var(--radius-lg); max-width: 700px;
  width: 100%; margin-top: 40px; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.detail-header {
  padding: 24px 28px 0; display: flex; justify-content: space-between; align-items: flex-start;
}
.detail-category {
  padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700;
  display: inline-block; margin-bottom: 12px;
}
.detail-title {
  font-size: 22px; font-weight: 900; color: var(--navy); line-height: 1.35;
  letter-spacing: -0.5px;
}
.detail-close {
  background: none; border: none; font-size: 22px; color: var(--gray-400);
  cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all 0.2s;
}
.detail-close:hover { background: var(--gray-100); color: var(--navy); }
.detail-meta {
  padding: 12px 28px; font-size: 13px; color: var(--gray-400);
  border-bottom: 1px solid var(--gray-100);
  display: flex; gap: 12px; align-items: center;
}
.detail-meta strong { color: var(--gray-600); }
.detail-body {
  padding: 24px 28px; font-size: 15px; line-height: 1.8; color: var(--gray-700);
  white-space: pre-wrap;
}
.detail-actions {
  padding: 16px 28px; border-top: 1px solid var(--gray-100);
  display: flex; gap: 12px;
}
.action-btn {
  padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
  border: 1.5px solid var(--gray-200); background: white; color: var(--gray-500);
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.action-btn:hover { border-color: var(--gray-300); color: var(--navy); }
.action-btn.liked { border-color: var(--orange); color: var(--orange); background: var(--orange-light); }

/* COMMENT SECTION IN DETAIL */
.detail-comments {
  padding: 0 28px 24px; border-top: 1px solid var(--gray-100); margin-top: 0;
}
.detail-comments-title {
  font-size: 14px; font-weight: 800; color: var(--navy); margin: 16px 0 12px;
}
.dc-input-area { display: flex; gap: 8px; margin-bottom: 14px; }
.dc-input {
  flex: 1; padding: 10px 14px; border: 1.5px solid var(--gray-200);
  border-radius: 10px; font-size: 14px; font-family: inherit; outline: none;
  transition: border-color 0.2s;
}
.dc-input:focus { border-color: var(--orange); }
.dc-submit {
  padding: 10px 16px; background: var(--navy); color: white;
  border: none; border-radius: 10px; font-size: 13px; font-weight: 700;
  font-family: inherit; cursor: pointer; white-space: nowrap;
}
.dc-submit:hover { background: var(--navy-light); }
.dc-item { padding: 10px 0; border-bottom: 1px solid var(--gray-100); }
.dc-item:last-child { border-bottom: none; }
.dc-item-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
.dc-item-author { font-size: 13px; font-weight: 700; color: var(--navy); }
.dc-item-date { font-size: 11px; color: var(--gray-400); }
.dc-item-text { font-size: 13px; color: var(--gray-600); line-height: 1.5; }
.dc-login-msg {
  text-align: center; padding: 14px; background: var(--gray-50);
  border-radius: 10px; font-size: 13px; color: var(--gray-400);
}
.dc-login-msg a { color: var(--orange); font-weight: 700; cursor: pointer; text-decoration: none; }

/* WRITE MODAL */
.write-overlay {
  display: none; position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
  padding: 24px; overflow-y: auto;
}
.write-overlay.open { display: flex; justify-content: center; align-items: flex-start; }
.write-modal {
  background: white; border-radius: var(--radius-lg); max-width: 600px;
  width: 100%; margin-top: 40px; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.write-header {
  padding: 24px 28px; border-bottom: 1px solid var(--gray-100);
  display: flex; justify-content: space-between; align-items: center;
}
.write-title { font-size: 20px; font-weight: 900; color: var(--navy); }
.write-body { padding: 24px 28px; }
.write-field { margin-bottom: 18px; }
.write-label {
  display: block; font-size: 13px; font-weight: 700; color: var(--navy);
  margin-bottom: 6px;
}
.write-select, .write-input, .write-textarea {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--gray-200);
  border-radius: 10px; font-size: 14px; font-family: inherit;
  outline: none; transition: border-color 0.2s; background: white;
}
.write-select:focus, .write-input:focus, .write-textarea:focus {
  border-color: var(--orange);
}
.write-textarea { min-height: 180px; resize: vertical; line-height: 1.7; }
.write-footer {
  padding: 16px 28px; border-top: 1px solid var(--gray-100);
  display: flex; justify-content: flex-end; gap: 10px;
}
.write-cancel {
  padding: 10px 20px; background: var(--gray-100); color: var(--gray-600);
  border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.write-submit {
  padding: 10px 24px; background: var(--orange); color: white;
  border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
  font-family: inherit; cursor: pointer; transition: background 0.2s;
}
.write-submit:hover { background: var(--orange-hover); }

/* LOGIN POPUP */
.login-overlay {
  display: none; position: fixed; inset: 0; z-index: 3000;
  background: rgba(0,0,0,0.5); justify-content: center; align-items: center;
}
.login-overlay.open { display: flex; }
.login-box {
  background: white; border-radius: var(--radius-lg); padding: 32px;
  max-width: 380px; width: 100%; text-align: center;
}
.login-icon { font-size: 40px; margin-bottom: 12px; }
.login-title { font-size: 18px; font-weight: 900; color: var(--navy); margin-bottom: 8px; }
.login-desc { font-size: 14px; color: var(--gray-500); margin-bottom: 20px; }
.google-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 14px; background: white; border: 1.5px solid var(--gray-200);
  border-radius: 12px; font-size: 15px; font-weight: 700; font-family: inherit;
  color: var(--gray-700); cursor: pointer; transition: all 0.2s;
}
.google-btn:hover { border-color: var(--gray-300); box-shadow: var(--shadow-sm); }
.google-btn svg { width: 20px; height: 20px; }
.login-skip {
  display: block; margin-top: 12px; font-size: 13px; color: var(--gray-400);
  background: none; border: none; cursor: pointer; font-family: inherit;
}

/* EMPTY STATE */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--gray-400);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 15px; font-weight: 600; }

/* MOBILE */
.mobile-menu-btn {
  display: none; background: none; border: none;
  font-size: 22px; cursor: pointer; color: var(--navy); padding: 4px;
}
@media (max-width: 768px) {
  .mobile-menu-btn { display: block; }
  .nav-links a { display: none; }
  .nav-inner { padding: 0 16px; height: 56px; }
  .nav-logo { font-size: 17px; }
  .nav-logo .logo-icon { width: 30px; height: 30px; font-size: 13px; border-radius: 8px; }
  .container { padding: 72px 16px 40px; }
  .page-header { flex-direction: column; gap: 12px; align-items: flex-start; }
  .page-title { font-size: 22px; }
  .post-title { font-size: 15px; }
  .post-preview { font-size: 12px; }
  .post-item { padding: 14px 16px; }
  .detail-modal, .write-modal { margin-top: 0; border-radius: 0; min-height: 100vh; }
  .detail-header, .detail-meta, .detail-body, .detail-actions, .detail-comments { padding-left: 18px; padding-right: 18px; }
  .write-header, .write-body, .write-footer { padding-left: 18px; padding-right: 18px; }
  .detail-title { font-size: 19px; }
  .category-tabs { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
  .cat-tab { flex-shrink: 0; }
}

/* MOBILE NAV DRAWER */
.mobile-nav-overlay {
  display: none; position: fixed; inset: 0; z-index: 1500;
  background: rgba(0,0,0,0.4); transition: opacity 0.3s;
}
.mobile-nav-overlay.open { display: block; }
.mobile-nav-drawer {
  position: fixed; top: 0; right: -280px; width: 280px; height: 100%;
  background: white; z-index: 1600; transition: right 0.3s;
  padding: 24px 20px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: -4px 0 24px rgba(0,0,0,0.1);
}
.mobile-nav-drawer.open { right: 0; }
.mobile-nav-close {
  align-self: flex-end; background: none; border: none;
  font-size: 24px; color: var(--gray-400); cursor: pointer; padding: 4px;
}
.mobile-nav-logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 18px; color: var(--navy);
  margin-bottom: 16px;
}
.mobile-nav-links { display: flex; flex-direction: column; gap: 4px; }
.mobile-nav-links a {
  padding: 12px 14px; border-radius: 10px; font-size: 15px; font-weight: 600;
  color: var(--gray-600); text-decoration: none; display: flex; align-items: center; gap: 10px;
  transition: all 0.2s;
}
.mobile-nav-links a:hover { background: var(--gray-100); color: var(--navy); }
.mobile-nav-links a.active { background: var(--orange-light); color: var(--orange); }
.nav-icon { font-size: 16px; width: 22px; text-align: center; }
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="logo-icon">82</div>
      팔이피플
    </a>
    <div class="nav-links">
      <a href="index.html#rankings">랭킹</a>
      <a href="index.html#platforms">플랫폼</a>
      <a href="index.html#detector">감별기</a>
      <a href="community.html" class="active">커뮤니티</a>
      <a href="admin.html" style="font-size:12px;color:var(--gray-400)">관리자</a>
      <div class="nav-profile" id="navProfile" onclick="toggleProfileDropdown(event)">
        <img class="nav-profile-img" id="navProfileImg" src="" alt="">
        <span class="nav-profile-name" id="navProfileName"></span>
        <div class="nav-profile-dropdown" id="profileDropdown">
          <div class="nav-profile-dropdown-header">
            <img id="dropdownProfileImg" src="" alt="">
            <div class="nav-profile-dropdown-info">
              <div class="nav-profile-dropdown-name" id="dropdownName"></div>
              <div class="nav-profile-dropdown-email" id="dropdownEmail"></div>
            </div>
          </div>
          <a href="#" onclick="openMyPage(); return false;"><span class="dropdown-icon">👤</span> 마이페이지</a>
          <a href="#" onclick="openWriteModal(); closeProfileDropdown(); return false;"><span class="dropdown-icon">✏️</span> 글쓰기</a>
          <button class="logout-btn" onclick="logoutUser()"><span class="dropdown-icon">🚪</span> 로그아웃</button>
        </div>
      </div>
      <button class="mobile-menu-btn" onclick="openMobileNav()">☰</button>
    </div>
  </div>
</nav>

<!-- MOBILE NAV -->

const db = firebase.firestore();
let currentUser = null;
let pendingAction = null;

function getDisplayName() {
  if (!currentUser) return '';
  return currentUser.nickname || currentUser.name;
}

firebase.auth().onAuthStateChanged(async user => {
  if (user) {
    currentUser = { uid: user.uid, name: user.displayName, email: user.email, picture: user.photoURL, nickname: '' };
    try {
      const doc = await db.collection('users').doc(user.uid).get();
      if (doc.exists && doc.data().nickname) {
        currentUser.nickname = doc.data().nickname;
      }
      await db.collection('users').doc(user.uid).set({
        displayName: user.displayName, email: user.email, photoURL: user.photoURL, lastLogin: new Date().toISOString()
      }, { merge: true });
    } catch(e) {}
    showNavProfile();
  } else {
    currentUser = null;
    hideNavProfile();
  }
});

function showNavProfile() {
  if (!currentUser) return;
  const el = document.getElementById('navProfile');
  document.getElementById('navProfileImg').src = currentUser.picture;
  document.getElementById('navProfileName').textContent = getDisplayName();
  document.getElementById('dropdownProfileImg').src = currentUser.picture;
  document.getElementById('dropdownName').textContent = getDisplayName();
  document.getElementById('dropdownEmail').textContent = currentUser.email;
  el.classList.add('show');
}
function hideNavProfile() {
  document.getElementById('navProfile').classList.remove('show');
  closeProfileDropdown();
}
function toggleProfileDropdown(e) {
  e.stopPropagation();
  document.getElementById('profileDropdown').classList.toggle('open');
}
function closeProfileDropdown() {
  document.getElementById('profileDropdown').classList.remove('open');
}
document.addEventListener('click', e => {
  if (!document.getElementById('navProfile').contains(e.target)) closeProfileDropdown();
});
function logoutUser() {
  firebase.auth().signOut();
  closeProfileDropdown();
}
async function saveNickname() {
  if (!currentUser) return;
  const nick = document.getElementById('nicknameInput').value.trim();
  if (!nick) { alert('닉네임을 입력해주세요.'); return; }
  if (nick.length > 20) { alert('닉네임은 20자 이내로 입력해주세요.'); return; }
  try {
    await db.collection('users').doc(currentUser.uid).update({ nickname: nick });
    currentUser.nickname = nick;
    showNavProfile();
    document.getElementById('nicknameSaved').style.display = 'block';
    setTimeout(() => document.getElementById('nicknameSaved').style.display = 'none', 2000);
    document.querySelector('.mypage-user-name').textContent = getDisplayName();
  } catch(e) { alert('저장 실패: ' + e.message); }
}
function openMyPage() {
  closeProfileDropdown();
  if (!currentUser) return;
  document.getElementById('mypageUser').innerHTML = `
    <img src="${currentUser.picture}" alt="">
    <div>
      <div class="mypage-user-name">${getDisplayName()}</div>
      <div class="mypage-user-email">${currentUser.email}${currentUser.nickname ? ' · 구글: ' + currentUser.name : ''}</div>
    </div>`;
  document.getElementById('nicknameInput').value = currentUser.nickname || '';
  // 내가 쓴 글
  let postHTML = '';
  posts.forEach(p => {
    if (p.author === getDisplayName() || p.author === currentUser.name) {
      postHTML += `<div class="mypage-review-item">
        <div class="mypage-review-meta">${p.date} · ${p.category}</div>
        <div class="mypage-review-text">${p.title}</div>
      </div>`;
    }
  });
  document.getElementById('mypagePosts').innerHTML = postHTML || '<div class="mypage-empty">아직 작성한 글이 없습니다.</div>';
  // 내가 쓴 댓글
  let commentHTML = '';
  posts.forEach(p => {
    p.comments.forEach(c => {
      if (c.author === getDisplayName() || c.author === currentUser.name) {
        commentHTML += `<div class="mypage-review-item">
          <div class="mypage-review-meta">${c.date} · ${p.title}</div>
          <div class="mypage-review-text">${c.text}</div>
        </div>`;
      }
    });
  });
  document.getElementById('mypageComments').innerHTML = commentHTML || '<div class="mypage-empty">아직 작성한 댓글이 없습니다.</div>';
  document.getElementById('mypageOverlay').classList.add('open');
}
function closeMyPage() {
  document.getElementById('mypageOverlay').classList.remove('open');
}

function googleLogin() {
  closeLogin();
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).then(result => {
    const user = result.user;
    currentUser = { name: user.displayName, email: user.email, picture: user.photoURL };
    if (pendingAction === 'write') openWriteModal();
  }).catch(err => {
    if (err.code !== 'auth/popup-closed-by-user') {
      alert('로그인 실패: ' + err.message);
    }
  });
}

let currentFilter = '전체';
let nextId = posts.length + 1;

// ═══ RENDER ═══
const categoryStyles = {
  '자유': 'free', '수강후기': 'review', '질문': 'question', '꿀팁': 'tip'
};

function renderPosts() {
  const list = document.getElementById('postList');
  let filtered = currentFilter === '전체' ? posts : posts.filter(p => p.category === currentFilter);

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-text">아직 작성된 글이 없습니다.</div></div>';
    return;
  }

  list.innerHTML = filtered.map(p => `
    <div class="post-item" onclick="openPost(${p.id})">
      <div class="post-top">
        <span class="post-category-badge ${categoryStyles[p.category] || ''}">${p.category}</span>
        ${p.likes >= 100 ? '<span class="post-hot">HOT</span>' : ''}
      </div>
      <div class="post-title">${p.title}</div>
      <div class="post-preview">${p.content.replace(/\n/g, ' ').substring(0, 80)}...</div>
      <div class="post-bottom">
        <span class="post-author">${p.author}</span>
        <div class="post-stats">
          <span class="post-stat">👁 ${p.views}</span>
          <span class="post-stat">❤️ ${p.likes}</span>
          <span class="post-stat">💬 ${p.commentCount + (p.comments?.length || 0)}</span>
          <span class="post-stat">${p.date}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function filterPosts(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderPosts();
}

// ═══ DETAIL ═══
let currentPostId = null;

function openPost(id) {
  const p = posts.find(x => x.id === id);
  if (!p) return;
  currentPostId = id;
  p.views++;

  const catStyle = categoryStyles[p.category] || '';
  document.getElementById('detailCategory').className = `detail-category post-category-badge ${catStyle}`;
  document.getElementById('detailCategory').textContent = p.category;
  document.getElementById('detailTitle').textContent = p.title;
  document.getElementById('detailMeta').innerHTML = `<strong>${p.author}</strong> · ${p.date} · 조회 ${p.views}`;
  document.getElementById('detailBody').textContent = p.content;
  document.getElementById('detailActions').innerHTML = `
    <button class="action-btn" id="likeBtn" onclick="toggleLike(${id})">❤️ 좋아요 ${p.likes}</button>
    <button class="action-btn">🔗 공유</button>
    <button class="action-btn">🚩 신고</button>
  `;
  renderDetailComments(p);
  document.getElementById('detailOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderDetailComments(p) {
  const el = document.getElementById('detailComments');
  const allComments = p.comments || [];
  el.innerHTML = `
    <div class="detail-comments-title">댓글 ${allComments.length}개</div>
    ${currentUser
      ? `<div class="dc-input-area"><input class="dc-input" id="dcInput" placeholder="댓글을 입력하세요"><button class="dc-submit" onclick="submitDetailComment()">등록</button></div>`
      : `<div class="dc-login-msg">댓글을 작성하려면 <a onclick="pendingAction=null;document.getElementById('loginOverlay').classList.add('open')">로그인</a>이 필요합니다.</div>`
    }
    ${allComments.map(c => `
      <div class="dc-item">
        <div class="dc-item-top"><span class="dc-item-author">${c.author}</span><span class="dc-item-date">${c.date}</span></div>
        <div class="dc-item-text">${c.text}</div>
      </div>
    `).join('')}
  `;
}

function submitDetailComment() {
  const input = document.getElementById('dcInput');
  if (!input || !input.value.trim()) { alert('댓글을 입력해주세요.'); return; }
  const p = posts.find(x => x.id === currentPostId);
  if (!p) return;
  const today = new Date();
  const dateStr = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  p.comments.push({ author: getDisplayName(), date: dateStr, text: input.value.trim() });
  renderDetailComments(p);
  renderPosts();
}

function toggleLike(id) {
  const p = posts.find(x => x.id === id);
  if (!p) return;
  const btn = document.getElementById('likeBtn');
  if (btn.classList.contains('liked')) {
    btn.classList.remove('liked');
    p.likes--;
  } else {
    btn.classList.add('liked');
    p.likes++;
  }
  btn.innerHTML = `❤️ 좋아요 ${p.likes}`;
  renderPosts();
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ═══ WRITE ═══
function openWriteModal() {
  if (!currentUser) {
    pendingAction = 'write';
    document.getElementById('loginOverlay').classList.add('open');
    return;
  }
  document.getElementById('writeOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeWriteModal() {
  document.getElementById('writeOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function submitPost() {
  const category = document.getElementById('writeCategory').value;
  const title = document.getElementById('writeTitle').value.trim();
  const content = document.getElementById('writeContent').value.trim();
  if (!title) { alert('제목을 입력해주세요.'); return; }
  if (!content) { alert('내용을 입력해주세요.'); return; }
  if (content.length < 10) { alert('내용을 10자 이상 작성해주세요.'); return; }

  const today = new Date();
  const dateStr = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;

  posts.unshift({
    id: nextId++, category, title, author: getDisplayName(),
    date: dateStr, views: 0, likes: 0, commentCount: 0,
    content, comments: []
  });

  document.getElementById('writeTitle').value = '';
  document.getElementById('writeContent').value = '';
  closeWriteModal();
  renderPosts();
}

// ═══ LOGIN ═══
function closeLogin() {
  document.getElementById('loginOverlay').classList.remove('open');
}

// ═══ MOBILE NAV ═══
function openMobileNav() {
  document.getElementById('mobileNavOverlay').classList.add('open');
  document.getElementById('mobileNavDrawer').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeMobileNav() {
  document.getElementById('mobileNavOverlay').classList.remove('open');
  document.getElementById('mobileNavDrawer').classList.remove('open');
  document.body.style.overflow = '';
}

// ═══ INIT ═══
renderPosts();
</script>
</body>
</html>
