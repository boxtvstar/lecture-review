<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팔이피플 — 커뮤니티</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --navy: #1B2A4A; --navy-light: #2A3F6A; --navy-dark: #111D35;
  --orange: #FF6B35; --orange-hover: #E85A28; --orange-light: #FFF0E9;
  --white: #FFFFFF;
  --gray-50: #F8F9FB; --gray-100: #F1F3F7; --gray-200: #E2E6EE;
  --gray-300: #C8CFDB; --gray-400: #9BA3B5; --gray-500: #6B7280;
  --gray-600: #4B5563; --gray-700: #374151;
  --green: #10B981; --green-light: #ECFDF5;
  --red: #EF4444; --red-light: #FEF2F2;
  --blue: #3B82F6; --blue-light: #EFF6FF;
  --gold: #F59E0B;
  --shadow-sm: 0 1px 3px rgba(27,42,74,0.06);
  --shadow-md: 0 4px 16px rgba(27,42,74,0.08);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
  background: var(--gray-50); color: var(--gray-700);
  line-height: 1.6; -webkit-font-smoothing: antialiased;
}

/* nav.js가 NAV CSS를 자동 주입 */

/* CONTAINER */
.container {
  max-width: 800px; margin: 0 auto; padding: 88px 24px 60px;
}

/* PAGE HEADER */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px;
}
.page-title {
  font-size: 26px; font-weight: 900; color: var(--navy);
  letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px;
}
.page-title .icon { font-size: 24px; }
.btn-write {
  padding: 10px 20px; background: var(--orange); color: white;
  border: none; border-radius: var(--radius-sm); font-size: 14px;
  font-weight: 700; font-family: inherit; cursor: pointer;
  transition: all 0.2s; text-decoration: none;
}
.btn-write:hover { background: var(--orange-hover); transform: translateY(-1px); }

/* CATEGORY TABS */
.category-tabs {
  display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap;
}
.cat-tab {
  padding: 7px 16px; border-radius: 100px; font-size: 13px; font-weight: 700;
  border: 1.5px solid var(--gray-200); background: white; color: var(--gray-500);
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.cat-tab.active { background: var(--navy); color: white; border-color: var(--navy); }
.cat-tab:hover:not(.active) { border-color: var(--gray-300); color: var(--navy); }

/* POST LIST */
.post-list { display: flex; flex-direction: column; gap: 1px; }
.post-item {
  background: white; padding: 18px 20px;
  border: 1px solid var(--gray-200); border-radius: var(--radius-md);
  cursor: pointer; transition: all 0.2s; margin-bottom: 8px;
}
.post-item:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.post-top {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
}
.post-category-badge {
  padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
  background: var(--blue-light); color: var(--blue);
}
.post-category-badge.free { background: var(--green-light); color: var(--green); }
.post-category-badge.review { background: var(--orange-light); color: var(--orange); }
.post-category-badge.tip { background: #F3E8FF; color: #7C3AED; }
.post-category-badge.question { background: var(--gold); color: white; }
.post-hot {
  padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800;
  background: var(--red); color: white;
}
.post-title {
  font-size: 16px; font-weight: 700; color: var(--navy);
  margin-bottom: 6px; line-height: 1.4;
}
.post-preview {
  font-size: 13px; color: var(--gray-500); line-height: 1.5;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  max-width: 100%;
}
.post-bottom {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 10px; font-size: 12px; color: var(--gray-400);
}
.post-author { font-weight: 600; color: var(--gray-500); }
.post-stats { display: flex; gap: 12px; }
.post-stat { display: flex; align-items: center; gap: 3px; }

/* POST DETAIL MODAL */
.detail-overlay {
  display: none; position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
  padding: 24px; overflow-y: auto;
}
.detail-overlay.open { display: flex; justify-content: center; align-items: flex-start; }
.detail-modal {
  background: white; border-radius: var(--radius-lg); max-width: 700px;
  width: 100%; margin-top: 40px; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.detail-header {
  padding: 24px 28px 0; display: flex; justify-content: space-between; align-items: flex-start;
}
.detail-category {
  padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700;
  display: inline-block; margin-bottom: 12px;
}
.detail-title {
  font-size: 22px; font-weight: 900; color: var(--navy); line-height: 1.35;
  letter-spacing: -0.5px;
}
.detail-close {
  background: none; border: none; font-size: 22px; color: var(--gray-400);
  cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all 0.2s;
}
.detail-close:hover { background: var(--gray-100); color: var(--navy); }
.detail-meta {
  padding: 12px 28px; font-size: 13px; color: var(--gray-400);
  border-bottom: 1px solid var(--gray-100);
  display: flex; gap: 12px; align-items: center;
}
.detail-meta strong { color: var(--gray-600); }
.detail-body {
  padding: 24px 28px; font-size: 15px; line-height: 1.8; color: var(--gray-700);
  white-space: pre-wrap;
}
.detail-actions {
  padding: 16px 28px; border-top: 1px solid var(--gray-100);
  display: flex; gap: 12px;
}
.action-btn {
  padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
  border: 1.5px solid var(--gray-200); background: white; color: var(--gray-500);
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.action-btn:hover { border-color: var(--gray-300); color: var(--navy); }
.action-btn.liked { border-color: var(--orange); color: var(--orange); background: var(--orange-light); }

/* COMMENT SECTION IN DETAIL */
.detail-comments {
  padding: 0 28px 24px; border-top: 1px solid var(--gray-100); margin-top: 0;
}
.detail-comments-title {
  font-size: 14px; font-weight: 800; color: var(--navy); margin: 16px 0 12px;
}
.dc-input-area { display: flex; gap: 8px; margin-bottom: 14px; }
.dc-input {
  flex: 1; padding: 10px 14px; border: 1.5px solid var(--gray-200);
  border-radius: 10px; font-size: 14px; font-family: inherit; outline: none;
  transition: border-color 0.2s;
}
.dc-input:focus { border-color: var(--orange); }
.dc-submit {
  padding: 10px 16px; background: var(--navy); color: white;
  border: none; border-radius: 10px; font-size: 13px; font-weight: 700;
  font-family: inherit; cursor: pointer; white-space: nowrap;
}
.dc-submit:hover { background: var(--navy-light); }
.dc-item { padding: 10px 0; border-bottom: 1px solid var(--gray-100); }
.dc-item:last-child { border-bottom: none; }
.dc-item-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
.dc-item-author { font-size: 13px; font-weight: 700; color: var(--navy); }
.dc-item-date { font-size: 11px; color: var(--gray-400); }
.dc-item-text { font-size: 13px; color: var(--gray-600); line-height: 1.5; }
.dc-login-msg {
  text-align: center; padding: 14px; background: var(--gray-50);
  border-radius: 10px; font-size: 13px; color: var(--gray-400);
}
.dc-login-msg a { color: var(--orange); font-weight: 700; cursor: pointer; text-decoration: none; }

/* WRITE MODAL */
.write-overlay {
  display: none; position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
  padding: 24px; overflow-y: auto;
}
.write-overlay.open { display: flex; justify-content: center; align-items: flex-start; }
.write-modal {
  background: white; border-radius: var(--radius-lg); max-width: 600px;
  width: 100%; margin-top: 40px; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.write-header {
  padding: 24px 28px; border-bottom: 1px solid var(--gray-100);
  display: flex; justify-content: space-between; align-items: center;
}
.write-title { font-size: 20px; font-weight: 900; color: var(--navy); }
.write-body { padding: 24px 28px; }
.write-field { margin-bottom: 18px; }
.write-label {
  display: block; font-size: 13px; font-weight: 700; color: var(--navy);
  margin-bottom: 6px;
}
.write-select, .write-input, .write-textarea {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--gray-200);
  border-radius: 10px; font-size: 14px; font-family: inherit;
  outline: none; transition: border-color 0.2s; background: white;
}
.write-select:focus, .write-input:focus, .write-textarea:focus {
  border-color: var(--orange);
}
.write-textarea { min-height: 180px; resize: vertical; line-height: 1.7; }
.write-footer {
  padding: 16px 28px; border-top: 1px solid var(--gray-100);
  display: flex; justify-content: flex-end; gap: 10px;
}
.write-cancel {
  padding: 10px 20px; background: var(--gray-100); color: var(--gray-600);
  border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
  font-family: inherit; cursor: pointer;
}
.write-submit {
  padding: 10px 24px; background: var(--orange); color: white;
  border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
  font-family: inherit; cursor: pointer; transition: background 0.2s;
}
.write-submit:hover { background: var(--orange-hover); }

/* LOGIN POPUP */
.login-overlay {
  display: none; position: fixed; inset: 0; z-index: 3000;
  background: rgba(0,0,0,0.5); justify-content: center; align-items: center;
}
.login-overlay.open { display: flex; }
.login-box {
  background: white; border-radius: var(--radius-lg); padding: 32px;
  max-width: 380px; width: 100%; text-align: center;
}
.login-icon { font-size: 40px; margin-bottom: 12px; }
.login-title { font-size: 18px; font-weight: 900; color: var(--navy); margin-bottom: 8px; }
.login-desc { font-size: 14px; color: var(--gray-500); margin-bottom: 20px; }
.google-btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 14px; background: white; border: 1.5px solid var(--gray-200);
  border-radius: 12px; font-size: 15px; font-weight: 700; font-family: inherit;
  color: var(--gray-700); cursor: pointer; transition: all 0.2s;
}
.google-btn:hover { border-color: var(--gray-300); box-shadow: var(--shadow-sm); }
.google-btn svg { width: 20px; height: 20px; }
.login-skip {
  display: block; margin-top: 12px; font-size: 13px; color: var(--gray-400);
  background: none; border: none; cursor: pointer; font-family: inherit;
}

/* EMPTY STATE */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--gray-400);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 15px; font-weight: 600; }

/* MOBILE - nav.js가 mobile nav CSS를 자동 주입 */
@media (max-width: 768px) {
  .container { padding: 72px 16px 40px; }
  .page-header { flex-direction: column; gap: 12px; align-items: flex-start; }
  .page-title { font-size: 22px; }
  .post-title { font-size: 15px; }
  .post-preview { font-size: 12px; }
  .post-item { padding: 14px 16px; }
  .detail-modal, .write-modal { margin-top: 0; border-radius: 0; min-height: 100vh; }
  .detail-header, .detail-meta, .detail-body, .detail-actions, .detail-comments { padding-left: 18px; padding-right: 18px; }
  .write-header, .write-body, .write-footer { padding-left: 18px; padding-right: 18px; }
  .detail-title { font-size: 19px; }
  .category-tabs { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
  .cat-tab { flex-shrink: 0; }
}
.post-manage-btns { display: flex; gap: 6px; margin-left: auto; }
.post-manage-btn {
  background: none; border: 1px solid var(--gray-200); border-radius: 6px;
  padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  font-family: inherit; transition: all 0.2s;
}
.post-manage-btn.edit { color: var(--orange); border-color: var(--orange); }
.post-manage-btn.edit:hover { background: var(--orange); color: white; }
.post-manage-btn.del { color: #EF4444; border-color: #EF4444; }
.post-manage-btn.del:hover { background: #EF4444; color: white; }
.post-manage-btn.admin-badge { color: #6366F1; border-color: #6366F1; font-size: 11px; cursor: default; }
.dc-item-actions { display: flex; gap: 6px; margin-left: auto; }
.dc-item-actions button {
  background: none; border: none; font-size: 12px; color: var(--gray-400);
  cursor: pointer; font-family: inherit; padding: 2px 4px;
}
.dc-item-actions button:hover { color: var(--navy); }
.dc-item-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dc-reply-btn { background: none; border: none; font-size: 12px; color: var(--gray-400); cursor: pointer; font-family: inherit; padding: 2px 4px; }
.dc-reply-btn:hover { color: var(--navy); }
.dc-replies { margin-left: 24px; border-left: 2px solid var(--gray-100); padding-left: 12px; margin-top: 8px; }
.dc-replies .dc-item { padding: 8px 0; }
.dc-reply-input-area { display: flex; gap: 6px; margin: 8px 0 4px 24px; }
.dc-reply-input-area input { flex: 1; padding: 6px 10px; border: 1px solid var(--gray-200); border-radius: 6px; font-size: 13px; font-family: inherit; outline: none; }
.dc-reply-input-area button { padding: 6px 12px; border-radius: 6px; background: var(--orange); color: white; border: none; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
/* nav.js가 notif/badge/mypage CSS를 자동 주입 */
.dc-like-btn { background: none; border: none; font-size: 12px; color: var(--gray-400); cursor: pointer; font-family: inherit; padding: 2px 6px; margin-top: 4px; transition: color 0.2s; }
.dc-like-btn:hover, .dc-like-btn.liked { color: #EF4444; }
.sort-tabs { display: flex; gap: 6px; margin-left: auto; }
.sort-tab { background: none; border: 1px solid var(--gray-200); border-radius: 16px; padding: 4px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; color: var(--gray-400); transition: all 0.2s; }
.sort-tab.active { background: var(--navy); color: white; border-color: var(--navy); }
</style>
</head>
<body>

<!-- nav.js가 자동 생성 -->
<script src="nav.js"></script>

<!-- CONTAINER -->
<div class="container">
  <div class="page-header">
    <div class="page-title"><span class="icon">💬</span> 커뮤니티</div>
    <button class="btn-write" onclick="openWriteModal()">✏️ 글쓰기</button>
  </div>

  <div class="category-tabs" id="categoryTabs" style="display:flex;align-items:center;flex-wrap:wrap;gap:6px">
    <button class="cat-tab active" onclick="filterPosts('전체', this)">전체</button>
    <button class="cat-tab" onclick="filterPosts('자유', this)">자유</button>
    <button class="cat-tab" onclick="filterPosts('수강후기', this)">수강후기</button>
    <button class="cat-tab" onclick="filterPosts('질문', this)">질문</button>
    <button class="cat-tab" onclick="filterPosts('꿀팁', this)">꿀팁</button>
    <div class="sort-tabs">
      <button class="sort-tab active" onclick="sortPosts('popular', this)">인기순</button>
      <button class="sort-tab" onclick="sortPosts('latest', this)">최신순</button>
    </div>
  </div>

  <div class="post-list" id="postList"></div>
</div>

<!-- POST DETAIL -->
<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-modal">
    <div class="detail-header">
      <div>
        <div class="detail-category" id="detailCategory"></div>
        <div class="detail-title" id="detailTitle"></div>
      </div>
      <button class="detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-meta" id="detailMeta"></div>
    <div class="detail-body" id="detailBody"></div>
    <div class="detail-actions" id="detailActions"></div>
    <div class="detail-comments" id="detailComments"></div>
  </div>
</div>

<!-- WRITE MODAL -->
<div class="write-overlay" id="writeOverlay" onclick="if(event.target===this)closeWriteModal()">
  <div class="write-modal">
    <div class="write-header">
      <div class="write-title">글쓰기</div>
      <button class="detail-close" onclick="closeWriteModal()">✕</button>
    </div>
    <div class="write-body">
      <div class="write-field">
        <label class="write-label">카테고리</label>
        <select class="write-select" id="writeCategory">
          <option value="자유">자유</option>
          <option value="수강후기">수강후기</option>
          <option value="질문">질문</option>
          <option value="꿀팁">꿀팁</option>
        </select>
      </div>
      <div class="write-field">
        <label class="write-label">제목</label>
        <input class="write-input" id="writeTitle" placeholder="제목을 입력하세요">
      </div>
      <div class="write-field">
        <label class="write-label">내용</label>
        <textarea class="write-textarea" id="writeContent" placeholder="내용을 입력하세요"></textarea>
      </div>
    </div>
    <div class="write-footer">
      <button class="write-cancel" onclick="closeWriteModal()">취소</button>
      <button class="write-submit" onclick="submitPost()">등록하기</button>
    </div>
  </div>
</div>

<!-- LOGIN POPUP -->
<div class="login-overlay" id="loginOverlay" onclick="if(event.target===this)closeLogin()">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <div class="login-title">로그인이 필요합니다</div>
    <div class="login-desc">글을 작성하려면 먼저 로그인해주세요.</div>
    <button class="google-btn" onclick="googleLogin()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Google로 계속하기
    </button>
    <button class="login-skip" onclick="closeLogin()">나중에 할게요</button>
  </div>
</div>

<script>
// ═══ AUTH ═══
// Firebase 초기화, db, currentUser, isAdmin, getDisplayName,
// showNavProfile, hideNavProfile, navGoogleLogin, toggleProfileDropdown,
// closeProfileDropdown, logoutUser, saveNickname, openMyPage, closeMyPage,
// 알림 시스템 등은 모두 nav.js에서 관리

let pendingAction = null;

// nav.js 로그인 콜백 - 로그인 후 게시글 렌더링
window.onNavLogin = function() { renderPosts(); };

// nav.js 마이페이지 콘텐츠 콜백
window.renderMyPageContent = function() {
  // 내가 쓴 글
  let postHTML = '';
  posts.forEach(p => {
    if (p.author === getDisplayName() || p.author === currentUser.name) {
      postHTML += `<div class="mypage-review-item clickable" onclick="closeMyPage();openPost(${p.id})">
        <div class="mypage-review-meta">${p.date} · ${p.category}</div>
        <div class="mypage-review-text">${p.title}</div>
      </div>`;
    }
  });
  document.getElementById('mypageReviews').innerHTML = postHTML || '<div class="mypage-empty">아직 작성한 글이 없습니다.</div>';
  // 내가 쓴 댓글
  let commentHTML = '';
  posts.forEach(p => {
    p.comments.forEach((c, ci) => {
      if (c.author === getDisplayName() || c.author === currentUser.name) {
        commentHTML += `<div class="mypage-review-item clickable" onclick="closeMyPage();openPost(${p.id});setTimeout(()=>{const el=document.getElementById('cmtText${ci}');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});el&&(el.style.background='#FFF7ED');setTimeout(()=>el&&(el.style.background=''),2000)},300)">
          <div class="mypage-review-meta">${c.date} · ${p.title}</div>
          <div class="mypage-review-text">${c.text}</div>
        </div>`;
      }
    });
  });
  document.getElementById('mypageComments').innerHTML = commentHTML || '<div class="mypage-empty">아직 작성한 댓글이 없습니다.</div>';
};

function googleLogin() {
  closeLogin();
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).then(result => {
    const user = result.user;
    currentUser = { name: user.displayName, email: user.email, picture: user.photoURL };
    if (pendingAction === 'write') openWriteModal();
  }).catch(err => {
    if (err.code !== 'auth/popup-closed-by-user') {
      alert('로그인 실패: ' + err.message);
    }
  });
}

let currentFilter = '전체';
let currentSort = 'popular';
let nextId = posts.length + 1;

// ═══ RENDER ═══
const categoryStyles = {
  '자유': 'free', '수강후기': 'review', '질문': 'question', '꿀팁': 'tip'
};

function getTotalCommentLikes(p) {
  let total = 0;
  (p.comments || []).forEach(c => { total += (c.likes || 0); (c.replies || []).forEach(r => { total += (r.likes || 0); }); });
  return total;
}

function renderPosts() {
  const list = document.getElementById('postList');
  let filtered = currentFilter === '전체' ? [...posts] : posts.filter(p => p.category === currentFilter);

  if (currentSort === 'popular') {
    filtered.sort((a, b) => (b.likes + getTotalCommentLikes(b)) - (a.likes + getTotalCommentLikes(a)));
  } else {
    filtered.sort((a, b) => b.id - a.id);
  }

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-text">아직 작성된 글이 없습니다.</div></div>';
    return;
  }

  list.innerHTML = filtered.map(p => `
    <div class="post-item" onclick="openPost(${p.id})">
      <div class="post-top">
        <span class="post-category-badge ${categoryStyles[p.category] || ''}">${p.category}</span>
        ${p.likes >= 100 ? '<span class="post-hot">HOT</span>' : ''}
      </div>
      <div class="post-title">${p.title}</div>
      <div class="post-preview">${p.content.replace(/\n/g, ' ').substring(0, 80)}...</div>
      <div class="post-bottom">
        <span class="post-author">${p.author}</span>
        <div class="post-stats">
          <span class="post-stat">👁 ${p.views}</span>
          <span class="post-stat">❤️ ${p.likes}</span>
          <span class="post-stat">💬 ${p.commentCount + (p.comments?.length || 0)}</span>
          <span class="post-stat">${p.date}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function filterPosts(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderPosts();
}

function sortPosts(sort, btn) {
  currentSort = sort;
  document.querySelectorAll('.sort-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderPosts();
}

// ═══ DETAIL ═══
let currentPostId = null;

function openPost(id) {
  const p = posts.find(x => x.id === id);
  if (!p) return;
  currentPostId = id;
  p.views++;

  const catStyle = categoryStyles[p.category] || '';
  document.getElementById('detailCategory').className = `detail-category post-category-badge ${catStyle}`;
  document.getElementById('detailCategory').textContent = p.category;
  document.getElementById('detailTitle').textContent = p.title;
  document.getElementById('detailMeta').innerHTML = `<strong>${p.author}</strong> · ${p.date} · 조회 ${p.views}`;
  document.getElementById('detailBody').textContent = p.content;
  const isMyPost = currentUser && (p.author === getDisplayName() || p.author === currentUser.name);
  const manageBtns = (isMyPost || isAdmin) ? `
    <div class="post-manage-btns">
      ${isAdmin && !isMyPost ? '<span class="post-manage-btn admin-badge">👑 관리자</span>' : ''}
      <button class="post-manage-btn edit" onclick="editPost(${id})">✏️ 수정</button>
      <button class="post-manage-btn del" onclick="deletePost(${id})">🗑️ 삭제</button>
    </div>` : '';
  document.getElementById('detailActions').innerHTML = `
    <button class="action-btn" id="likeBtn" onclick="toggleLike(${id})">❤️ 좋아요 ${p.likes}</button>
    <button class="action-btn">🔗 공유</button>
    <button class="action-btn">🚩 신고</button>
    ${manageBtns}
  `;
  renderDetailComments(p);
  document.getElementById('detailOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function countAllComments(comments) {
  let count = comments.length;
  comments.forEach(c => { if (c.replies) count += c.replies.length; });
  return count;
}

function renderDetailComments(p) {
  const el = document.getElementById('detailComments');
  const allComments = p.comments || [];
  const totalCount = countAllComments(allComments);
  el.innerHTML = `
    <div class="detail-comments-title">댓글 ${totalCount}개</div>
    ${currentUser
      ? `<div class="dc-input-area"><input class="dc-input" id="dcInput" placeholder="댓글을 입력하세요" onkeypress="if(event.key==='Enter')submitDetailComment()"><button class="dc-submit" onclick="submitDetailComment()">등록</button></div>`
      : `<div class="dc-login-msg">댓글을 작성하려면 <a onclick="pendingAction=null;document.getElementById('loginOverlay').classList.add('open')">로그인</a>이 필요합니다.</div>`
    }
    ${allComments.map((c, i) => {
      const isMyCmt = currentUser && (c.author === getDisplayName() || c.author === currentUser.name);
      const cmtActions = (isMyCmt || isAdmin) ? `<div class="dc-item-actions">
        <button onclick="editComment(${i})">수정</button>
        <button onclick="deleteComment(${i})">삭제</button>
      </div>` : '';
      const replyBtn = currentUser ? `<button class="dc-reply-btn" onclick="showReplyInput(${i})">↩ 답글</button>` : '';
      const cmtLikes = c.likes || 0;
      const cmtLikeBtn = `<button class="dc-like-btn" onclick="likeComment(${i})" id="cmtLike${i}">❤️ ${cmtLikes}</button>`;
      const replies = (c.replies || []).map((r, ri) => {
        const isMyReply = currentUser && (r.author === getDisplayName() || r.author === currentUser.name);
        const replyActions = (isMyReply || isAdmin) ? `<div class="dc-item-actions">
          <button onclick="deleteReply(${i},${ri})">삭제</button>
        </div>` : '';
        const rLikes = r.likes || 0;
        const rLikeBtn = `<button class="dc-like-btn" onclick="likeReply(${i},${ri})">❤️ ${rLikes}</button>`;
        return `<div class="dc-item">
          <div class="dc-item-top"><span class="dc-item-author">${r.author}</span><span class="dc-item-date">${r.date}</span>${replyActions}</div>
          <div class="dc-item-text">${r.text}</div>
          ${rLikeBtn}
        </div>`;
      }).join('');
      return `<div class="dc-item" id="cmtWrap${i}">
        <div class="dc-item-top"><span class="dc-item-author">${c.author}</span><span class="dc-item-date">${c.date}</span>${replyBtn}${cmtActions}</div>
        <div class="dc-item-text" id="cmtText${i}">${c.text}</div>
        ${cmtLikeBtn}
        ${replies ? `<div class="dc-replies">${replies}</div>` : ''}
        <div id="replyArea${i}"></div>
      </div>`;
    }).join('')}
  `;
}

function submitDetailComment() {
  const input = document.getElementById('dcInput');
  if (!input || !input.value.trim()) { alert('댓글을 입력해주세요.'); return; }
  const p = posts.find(x => x.id === currentPostId);
  if (!p) return;
  const today = new Date();
  const dateStr = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  p.comments.push({ author: getDisplayName(), date: dateStr, text: input.value.trim(), replies: [], likes: 0 });
  // 글 작성자에게 알림
  if (p.author !== getDisplayName()) {
    addNotif(`💬 "${p.title}" 글에 ${getDisplayName()}님이 댓글을 남겼습니다.`, p.id);
  }
  renderDetailComments(p);
  renderPosts();
}

function showReplyInput(i) {
  const area = document.getElementById('replyArea' + i);
  if (!area) return;
  if (area.innerHTML) { area.innerHTML = ''; return; }
  area.innerHTML = `<div class="dc-reply-input-area"><input id="replyInput${i}" placeholder="답글 입력..." onkeypress="if(event.key==='Enter')submitReply(${i})"><button onclick="submitReply(${i})">등록</button></div>`;
  document.getElementById('replyInput' + i).focus();
}

function submitReply(i) {
  const input = document.getElementById('replyInput' + i);
  if (!input || !input.value.trim()) return;
  const p = posts.find(x => x.id === currentPostId);
  if (!p || !p.comments[i]) return;
  const today = new Date();
  const dateStr = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  if (!p.comments[i].replies) p.comments[i].replies = [];
  p.comments[i].replies.push({ author: getDisplayName(), date: dateStr, text: input.value.trim(), likes: 0 });
  // 댓글 작성자에게 알림
  if (p.comments[i].author !== getDisplayName()) {
    addNotif(`↩ ${getDisplayName()}님이 회원님의 댓글에 답글을 남겼습니다.`, p.id);
  }
  renderDetailComments(p);
  renderPosts();
}

function deleteReply(ci, ri) {
  if (!confirm('답글을 삭제하시겠습니까?')) return;
  const p = posts.find(x => x.id === currentPostId);
  if (!p || !p.comments[ci] || !p.comments[ci].replies) return;
  p.comments[ci].replies.splice(ri, 1);
  renderDetailComments(p);
  renderPosts();
}

function likeComment(i) {
  const p = posts.find(x => x.id === currentPostId);
  if (!p || !p.comments[i]) return;
  if (!p.comments[i].likes) p.comments[i].likes = 0;
  p.comments[i].likes++;
  if (currentUser && p.comments[i].author !== getDisplayName()) {
    addNotif(`❤️ ${getDisplayName()}님이 회원님의 댓글을 좋아합니다.`, p.id);
  }
  renderDetailComments(p);
  renderPosts();
}

function likeReply(ci, ri) {
  const p = posts.find(x => x.id === currentPostId);
  if (!p || !p.comments[ci] || !p.comments[ci].replies[ri]) return;
  if (!p.comments[ci].replies[ri].likes) p.comments[ci].replies[ri].likes = 0;
  p.comments[ci].replies[ri].likes++;
  if (currentUser && p.comments[ci].replies[ri].author !== getDisplayName()) {
    addNotif(`❤️ ${getDisplayName()}님이 회원님의 답글을 좋아합니다.`, p.id);
  }
  renderDetailComments(p);
  renderPosts();
}

function toggleLike(id) {
  const p = posts.find(x => x.id === id);
  if (!p) return;
  const btn = document.getElementById('likeBtn');
  if (btn.classList.contains('liked')) {
    btn.classList.remove('liked');
    p.likes--;
  } else {
    btn.classList.add('liked');
    p.likes++;
    // 글 작성자에게 알림
    if (currentUser && p.author !== getDisplayName()) {
      addNotif(`❤️ ${getDisplayName()}님이 "${p.title}" 글을 좋아합니다.`, p.id);
    }
  }
  btn.innerHTML = `❤️ 좋아요 ${p.likes}`;
  renderPosts();
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ═══ 글 수정/삭제 ═══
let editingPostId = null;

function editPost(id) {
  const p = posts.find(x => x.id === id);
  if (!p) return;
  editingPostId = id;
  closeDetail();
  document.getElementById('writeCategory').value = p.category;
  document.getElementById('writeTitle').value = p.title;
  document.getElementById('writeContent').value = p.content;
  document.querySelector('.write-title').textContent = '글 수정';
  document.querySelector('.write-submit').textContent = '수정하기';
  document.querySelector('.write-submit').onclick = submitEditPost;
  document.getElementById('writeOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function submitEditPost() {
  const p = posts.find(x => x.id === editingPostId);
  if (!p) return;
  const title = document.getElementById('writeTitle').value.trim();
  const content = document.getElementById('writeContent').value.trim();
  if (!title) { alert('제목을 입력해주세요.'); return; }
  if (!content) { alert('내용을 입력해주세요.'); return; }
  p.category = document.getElementById('writeCategory').value;
  p.title = title;
  p.content = content;
  editingPostId = null;
  document.getElementById('writeTitle').value = '';
  document.getElementById('writeContent').value = '';
  document.querySelector('.write-title').textContent = '글쓰기';
  document.querySelector('.write-submit').textContent = '등록하기';
  document.querySelector('.write-submit').onclick = submitPost;
  closeWriteModal();
  renderPosts();
}

function deletePost(id) {
  if (!confirm('정말 삭제하시겠습니까?')) return;
  const idx = posts.findIndex(x => x.id === id);
  if (idx !== -1) posts.splice(idx, 1);
  closeDetail();
  renderPosts();
}

// ═══ 댓글 수정/삭제 ═══
function editComment(i) {
  const p = posts.find(x => x.id === currentPostId);
  if (!p || !p.comments[i]) return;
  const newText = prompt('댓글 수정:', p.comments[i].text);
  if (newText !== null && newText.trim()) {
    p.comments[i].text = newText.trim();
    renderDetailComments(p);
    renderPosts();
  }
}

function deleteComment(i) {
  if (!confirm('댓글을 삭제하시겠습니까?')) return;
  const p = posts.find(x => x.id === currentPostId);
  if (!p) return;
  p.comments.splice(i, 1);
  renderDetailComments(p);
  renderPosts();
}

// ═══ WRITE ═══
function openWriteModal() {
  if (!currentUser) {
    pendingAction = 'write';
    document.getElementById('loginOverlay').classList.add('open');
    return;
  }
  editingPostId = null;
  document.querySelector('.write-title').textContent = '글쓰기';
  document.querySelector('.write-submit').textContent = '등록하기';
  document.querySelector('.write-submit').onclick = submitPost;
  document.getElementById('writeTitle').value = '';
  document.getElementById('writeContent').value = '';
  document.getElementById('writeCategory').value = '자유';
  document.getElementById('writeOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeWriteModal() {
  document.getElementById('writeOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function submitPost() {
  const category = document.getElementById('writeCategory').value;
  const title = document.getElementById('writeTitle').value.trim();
  const content = document.getElementById('writeContent').value.trim();
  if (!title) { alert('제목을 입력해주세요.'); return; }
  if (!content) { alert('내용을 입력해주세요.'); return; }
  if (content.length < 10) { alert('내용을 10자 이상 작성해주세요.'); return; }

  const today = new Date();
  const dateStr = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;

  posts.unshift({
    id: nextId++, category, title, author: getDisplayName(),
    date: dateStr, views: 0, likes: 0, commentCount: 0,
    content, comments: []
  });

  document.getElementById('writeTitle').value = '';
  document.getElementById('writeContent').value = '';
  closeWriteModal();
  renderPosts();
}

// ═══ LOGIN ═══
function closeLogin() {
  const el = document.getElementById('loginOverlay');
  if (el) el.classList.remove('open');
}

// mobile nav, 알림 시스템 등은 nav.js에서 관리

// ═══ INIT ═══
renderPosts();
</script>
